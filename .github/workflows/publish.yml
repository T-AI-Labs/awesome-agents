name: Collect and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - data/history.json
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Writes back data/history.json, which holds the star snapshots growth is measured from.
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Collect agents
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run fetch

      - name: Assemble the site and the README
        run: |
          npm run assemble
          npm run readme

      - name: Keep the star snapshots and the README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json README.md
          git diff --cached --quiet || git commit -m "Update star snapshots and README"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
